name: Build Native-Modded Horizon

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mod_source:
        description: 'URL of a .hnmod or .hnmod bundle to build in'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev cmake unzip

      - name: Install horizon-mixins tool
        run: |
          mkdir -p tools
          git clone https://github.com/horizon-rust/horizon-mixins tools/horizon-mixins
          cd tools/horizon-mixins && cargo build --locked -p horizon-mixins-cli

      - name: Build modded (direct)
        run: |
          find . -type l -delete
          rm -rf /tmp/scratchpad/horizon-mod-bundle /tmp/scratchpad/horizon-output
          mkdir -p /tmp/scratchpad

          # Pin the .hnmod to THIS source's revision (so horizon-mixins accepts it)
          CURRENT_SHA=$(git rev-parse HEAD)
          echo "Current source SHA: $CURRENT_SHA"
          mkdir -p /tmp/scratchpad/horizon-mod-bundle
          unzip -o ./native-mods/horizon_optimizer-0.1.0.hnmod -d /tmp/scratchpad/horizon-mod-bundle
          sed -i "s/horizon_revision = \"[^\"]*\"/horizon_revision = \"$CURRENT_SHA\"/" /tmp/scratchpad/horizon-mod-bundle/mixins/horizon_optimizer/horizon-mixin.toml

          # Apply mixins
          ./tools/horizon-mixins/target/debug/horizon-mixins apply --workspace . --mods /tmp/scratchpad/horizon-mod-bundle/mixins --out /tmp/scratchpad/horizon-output

          # Build the modded game
          cd /tmp/scratchpad/horizon-output
          cargo build --release -p horizon-client --bin horizon-client

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: horizon-client
          path: /tmp/scratchpad/horizon-output/target/release/horizon-client
          if-no-files-found: error