name: Build Native-Modded Horizon

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mod_source:
        description: 'URL of a .hnmod or .hnmod bundle to build in'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev cmake unzip

      - name: Install horizon-mixins tool
        run: |
          mkdir -p tools
          git clone https://github.com/horizon-rust/horizon-mixins tools/horizon-mixins
          cd tools/horizon-mixins && cargo build --locked -p horizon-mixins-cli

      - name: Build modded (direct)
        run: |
          set -e
          find . -type l -delete
          rm -rf /tmp/scratchpad
          mkdir -p /tmp/scratchpad/horizon-mod-bundle
          unzip -o ./native-mods/horizon_optimizer-*.hnmod -d /tmp/scratchpad/horizon-mod-bundle
          for f in $(find /tmp/scratchpad/horizon-mod-bundle -name horizon-mixin.toml); do sed -i '/^[[:space:]]*horizon_revision[[:space:]]*=/d' "$f"; done
          OUTDIR=/tmp/scratchpad/stage$(date +%s)
          ./tools/horizon-mixins/target/debug/horizon-mixins apply --workspace . --mods /tmp/scratchpad/horizon-mod-bundle/mixins --out $OUTDIR
          cd $OUTDIR
          cargo build --release -p horizon-client --bin horizon-client 2>&1 | tail -5
          ls -la target/release/horizon-client
          mkdir -p /tmp/scratchpad/buildresult
          cp target/release/horizon-client /tmp/scratchpad/buildresult/horizon-client

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: horizon-client
          path: /tmp/scratchpad/buildresult/horizon-client
          if-no-files-found: error