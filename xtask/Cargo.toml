[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Repository tasks: cargo run -p xtask -- build-native | package BINARY OUTDIR | tokens"

[dependencies]
horizon-theme = { path = "../crates/horizon-theme" }
# Read .hnmod bundles (source-only zips) without shelling out to unzip.
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
