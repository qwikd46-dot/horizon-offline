schema = 1
id = "horizon_complementary"
name = "Horizon Complementary"
version = "1.6.0"
api = "0.1"
description = "A complementary/BSL-inspired look tuned for Horizon: a glowing sun, a moon that lights the world with soft shade and a reddened sunrise horizon, real water with a moon glint and a sky reflection, screen-space shadows, moon-lit clouds, a soft bloom and a filmic night grade, with quality presets and a commented settings file."
authors = ["Horizon", "qwikd46-dot"]
license = "MIT"
shared = ["common.wgsl", "water.wgsl"]

[sky]
file = "sky.wgsl"
name = "Atmosphere"

[material]
file = "material.wgsl"
name = "Material"

[[post]]
file = "post/shadows.wgsl"
name = "Shadows"

[[post]]
file = "post/bloom.wgsl"
name = "Bloom"

[[post]]
file = "post/grade.wgsl"
name = "Tonemap"

[[options]]
id = "night_quality"
name = "Night quality"
description = "One preset for dusk, dawn and night: it caps the Shadows, Bloom and Cloud quality taps at once. Low = 4 occlusion taps, one bloom ring, one cloud octave. Medium = 6 / two rings / two octaves. High = 10 / two rings / two octaves. Ultra = 16 / two rings / two octaves. The individual settings can go lower, never higher."
type = "choice"
values = ["Low", "Medium", "High", "Ultra"]
default = "Medium"

[[options]]
id = "shadows"
name = "Shadows (SSAO)"
description = "Screen-space ambient occlusion: the soft shade where surfaces meet and under objects. The engine has none of its own."
type = "bool"
default = true

[[options]]
id = "ao_strength"
name = "Shadows strength"
description = "How dark the ambient occlusion gets. Kept gentle on purpose: a strong, wide AO darkens the whole scene with distance and reads as the blocks shifting."
type = "float"
default = 0.3
min = 0.0
max = 1.0
step = 0.01

[[options]]
id = "ao_radius"
name = "Shadows radius"
description = "How far the occlusion reaches, in blocks. The taps themselves are taken at a small, clamped screen radius so the pattern never smears across a face."
type = "float"
default = 1.0
min = 0.5
max = 3.0
step = 0.05

[[options]]
id = "ao_quality"
name = "Shadows quality"
description = "Occlusion taps: 0 = 4 taps (fastest), 1 = 6, 2 = 10 (default), 3 = 16 (softest, slowest). The far half of the view is always skipped."
type = "int"
default = 2
min = 0
max = 3

[[options]]
id = "clouds"
name = "Clouds"
description = "Enables the atmospheric cloud layer. Off preserves a cleaner, faster look."
type = "bool"
default = true

[[options]]
id = "cloud_quality"
name = "Cloud quality"
description = "0 = one noise octave (fastest), 2 = two octaves (default). Higher quality keeps the cloud edges crisper."
type = "int"
default = 2
min = 0
max = 2

[[options]]
id = "fog"
name = "Fog"
description = "Aerial haze in the distance. Off leaves the horizon perfectly clear."
type = "bool"
default = true

[[options]]
id = "fog_amount"
name = "Fog amount"
description = "How strongly the little remaining haze tints the distance. It only reaches the last stretch before the far plane."
type = "float"
default = 0.1
min = 0.0
max = 1.0
step = 0.01

[[options]]
id = "sun_glow"
name = "Sun glow"
description = "The brightness of the sun's halo in the sky."
type = "float"
default = 0.9
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "moon_glow_amount"
name = "Moon glow"
description = "The brightness of the moon's soft halo in the sky."
type = "float"
default = 0.8
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "moonlight"
name = "Moonlight on the world"
description = "How strongly the moon lights terrain at night: canopy, trunks and hills read by its cool blue light. The pack cannot cast a shadow map, so this is a hemispheric light on what the sky reaches; the shadows pass adds the local shade."
type = "float"
default = 0.55
min = 0.0
max = 1.5
step = 0.01

[[options]]
id = "night_boost"
name = "Night brightness"
description = "A subtle lift in dark scenes while preserving a moody look."
type = "float"
default = 0.16
min = 0.0
max = 0.6
step = 0.01

[[options]]
id = "night_exposure"
name = "Night exposure"
description = "How much the whole picture lifts as the sun sets. Follows a smoothstep, so it never flickers."
type = "float"
default = 0.22
min = 0.0
max = 0.6
step = 0.01

[[options]]
id = "shadow_lift"
name = "Night shadow lift"
description = "A blue-tinted lift of the darkest tones at night, so albedo and detail survive instead of crushing to black."
type = "float"
default = 0.05
min = 0.0
max = 0.2
step = 0.005

[[options]]
id = "night_desaturate"
name = "Night vision desaturation"
description = "How much dark regions desaturate and shift blue at night, like human night vision. Greens stay readable."
type = "float"
default = 0.3
min = 0.0
max = 1.0
step = 0.01

[[options]]
id = "water"
name = "Water effects"
description = "Waves, the sun or moon highlight, caustics, the sky reflection and player or mob ripples on water."
type = "bool"
default = true

[[options]]
id = "water_waves"
name = "Water waves"
description = "How strong the moving water surface is. Waves fade out with distance, so far water stays calm."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.02

[[options]]
id = "water_specular"
name = "Water sun and moon glint"
description = "How bright the sun's or moon's highlight is on water. Lower is calmer; the highlight also fades out with distance."
type = "float"
default = 0.6
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "water_reflect"
name = "Water reflection"
description = "How much of the sky the water reflects at grazing angles."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.02

[[options]]
id = "water_caustics"
name = "Water caustics"
description = "The sun's bright web shimmering on the water in daylight, up close only."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.02

[[options]]
id = "water_ripples"
name = "Water ripples"
description = "How strongly rain pricks the surface and a swimmer leaves rings behind. 0 turns them off."
type = "float"
default = 0.6
min = 0.0
max = 1.5
step = 0.02

[[options]]
id = "bloom"
name = "Bloom"
description = "Adds a soft bloom around bright lights and sunrise highlights."
type = "bool"
default = true

[[options]]
id = "bloom_strength"
name = "Bloom strength"
description = "How far the bloom spreads over the picture. 0 turns it off."
type = "float"
default = 0.3
min = 0.0
max = 1.0
step = 0.01

[[options]]
id = "bloom_quality"
name = "Bloom quality"
description = "0 = 8 taps, one ring (fastest), 1 = two rings, 2 = default, 3 = 32 taps (softest, slowest). Bloom is the heaviest pass, so this is the first to lower on a weak GPU."
type = "int"
default = 2
min = 0
max = 3

[[options]]
id = "vignette"
name = "Vignette"
description = "Gentle darkness around the frame edges."
type = "bool"
default = false

[[options]]
id = "filmic"
name = "Filmic curve"
description = "Wraps the tone response for a more cinematic contrast curve."
type = "bool"
default = true

[[options]]
id = "saturation"
name = "Saturation"
description = "Colour intensity of the final frame."
type = "float"
default = 1.18
min = 0.6
max = 1.8
step = 0.02

[[options]]
id = "contrast"
name = "Contrast"
description = "Mid-tone contrast, tuned to mimic a lifted but natural look."
type = "float"
default = 1.08
min = 0.8
max = 1.55
step = 0.01

[[options]]
id = "exposure"
name = "Exposure"
description = "Overall brightness before tonemapping."
type = "float"
default = 1.05
min = 0.6
max = 1.8
step = 0.01

[[options]]
id = "warmth"
name = "Warmth"
description = "Adds a golden sunrise/sunset tint without making the world too orange."
type = "float"
default = 0.28
min = 0.0
max = 0.8
step = 0.01

[[options]]
id = "performance_mode"
name = "Performance mode"
description = "The lowest quality everywhere at once: 4 occlusion taps, one bloom ring, one cloud octave. Use it on a weak GPU instead of lowering each setting."
type = "bool"
default = false

[budget]
gpu_ms = 2.5
