# Horizon Complementary 2.1.0 - Complementary Reimagined port with Glistening Water
#
# This file documents every option. The game keeps your real values in options.txt; set them on
# Options > Horizon Settings > Shader Packs > Horizon Complementary. Nothing here is read by the
# game; it is a reference and a copy-paste list.
#
# One preset first. "Night quality" caps the Shadows, Bloom and Cloud quality taps at once, so a
# weak GPU only needs this one line changed. The individual settings below can go lower, never
# higher than the preset.
#
#   night_quality = "Low"      # 4 occlusion taps, one bloom ring, one cloud octave  (weakest GPU)
#   night_quality = "Medium"   # 6 taps, two bloom rings, two cloud octaves          (default)
#   night_quality = "High"     # 10 taps, two bloom rings, two cloud octaves
#   night_quality = "Ultra"    # 16 taps, two bloom rings, two cloud octaves         (best GPU)

# --- Night light (the headline) ---
moonlight = 0.55          # how strongly the moon lights the world at night (0..1.5)
night_boost = 0.16        # a subtle artistic lift in dark scenes (0..0.6)
night_exposure = 0.22     # how much the whole picture lifts as the sun sets (0..0.6)
shadow_lift = 0.05        # blue-tinted lift of the darkest tones, so detail survives (0..0.2)
night_desaturate = 0.30   # how much dark regions desaturate and shift blue (0..1)

# --- Shadows (screen-space ambient occlusion) ---
shadows = true            # the soft shade where surfaces meet and under objects
ao_strength = 0.3         # how dark it gets (0..1); gentle on purpose, see the README
ao_radius = 1.0           # how far it reaches, in blocks (0.5..3); taps use a clamped screen radius
ao_quality = 2            # 0=4 taps, 1=6, 2=10 (default), 3=16 (capped by night_quality)

# --- Sky ---
sun_glow = 0.9            # the sun's halo (0..2)
moon_glow_amount = 0.8    # the moon's soft halo (0..2)
clouds = true             # the atmospheric cloud layer
cloud_quality = 2         # 0 = one noise octave (fastest), 2 = two octaves (capped by night_quality)

# --- Water (Glistening Water V1.1) ---
water = true              # the wave surface, the sun glisten, caustics, reflection and ripples
water_waves = 0.5         # how strong the moving surface is (0..1)
water_specular = 0.6      # the sun glisten and the moon glint (0..2); lower is calmer
water_reflect = 0.5       # the sky reflection at grazing angles (0..1)
water_caustics = 0.5      # the sun's web on the water in daylight (0..1)
water_ripples = 0.6       # rain and swimmer rings (0..1.5)
water_clarity = 0.75      # how far light reaches into the water before it turns teal (0.1..1.5)

# --- Bloom ---
bloom = true
bloom_strength = 0.3      # how far it spreads (0..1)
bloom_quality = 2         # 0=8 taps one ring, 1=two rings, 2=default, 3=32 taps (capped by night_quality)

# --- Grade ---
exposure = 1.0
filmic = true             # a gentle S-curve in gamma space, on top of the tonemap below
contrast = 1.0
saturation = 1.0
warmth = 0.15             # the golden sunrise/sunset tint
vignette = false

# --- Fog ---
fog = true
fog_amount = 0.1          # only a little haze, and only in the last stretch before the far plane

# --- One switch for a weak GPU ---
performance_mode = false  # the lowest quality everywhere at once

# --- Complementary Reimagined tonemap and sun (2.0.0) ---
sun_strength = 0.55       # how strongly the sun lights the ground (0..1.5)
tm_exposure = 1.0         # exposure before the tonemap (0.4..2.8)
tm_contrast = 1.05        # tonemap contrast (0.5..2)
tm_white_path = 1.0       # tonemap white point (0.1..1.9)
tm_dark_desat = 0.25      # desaturation of dark regions (0..1)
